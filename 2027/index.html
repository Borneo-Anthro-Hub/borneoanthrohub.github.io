<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e37">
  <meta name="description" content="BAH 2027 is coming soon.">
  <title>BAH 2027 — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com">
  <link href="https://fonts.cdnfonts.com/css/general-sans" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --cursor-x: 50%;
      --cursor-y: 45%;
      --glow-x: 50vw;
      --glow-y: 45vh;
      --shift-x: 0px;
      --shift-y: 0px;
      --shift-x-small: 0px;
      --shift-y-small: 0px;
      --shift-x-inverse: 0px;
      --shift-y-inverse: 0px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: #163d36;
      color: #fff8df;
      font-family: "General Sans", sans-serif;
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      padding: clamp(1.25rem, 3.5vw, 3.5rem);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 229, 121, .16), transparent 25rem),
        linear-gradient(180deg, #498b81 0%, #216054 43%, #173e37 100%);
    }

    .page::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(rgba(255, 252, 207, .55) 1px, transparent 1.6px);
      background-size: 3.7rem 3.7rem;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
      opacity: .32;
      content: "";
    }

    .page::after {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 32rem;
      height: 32rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 238, 142, .32), rgba(255, 226, 110, .1) 33%, transparent 70%);
      transform: translate3d(var(--glow-x), var(--glow-y), 0) translate3d(-50%, -50%, 0);
      will-change: transform;
      pointer-events: none;
      content: "";
    }

    .masthead, .footnote {
      z-index: 3;
      align-items: center;
      gap: 1rem;
      align-self: start;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
    }

    .brand, .edition, .footnote {
      margin: 0;
      font-size: clamp(.63rem, .9vw, .78rem);
      font-weight: 650;
      letter-spacing: .16em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      line-height: 0;
    }

    .brand svg {
      display: block;
      width: clamp(3.7rem, 6vw, 5.2rem);
      height: auto;
    }

    .edition, .footnote { color: rgba(255, 248, 223, .76); }

    .hero {
      z-index: 3;
      display: grid;
      align-self: center;
      justify-items: center;
      padding: 1rem 0 4rem;
      text-align: center;
      transform: translate(var(--shift-x-small), var(--shift-y-small));
      transition: transform .25s ease-out;
      will-change: transform;
    }

    .eyebrow, .coming-soon {
      margin: 0;
      color: #fff0ab;
      font-size: clamp(.65rem, 1vw, .82rem);
      font-weight: 650;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .eyebrow { margin-bottom: clamp(.9rem, 2vh, 1.4rem); }

    h1 {
      margin: 0;
      color: #fff8db;
      font-size: clamp(5.4rem, 17.5vw, 17rem);
      font-weight: 700;
      letter-spacing: -.1em;
      line-height: .72;
      text-shadow: 0 .05em 0 #bd5e68, 0 .1em 0 rgba(80, 41, 58, .22), 0 .15em .45em rgba(10, 58, 45, .42);
    }

    .year {
      margin: clamp(.65rem, 1.7vh, 1.2rem) 0 0;
      color: #ffcc73;
      font-size: clamp(1.25rem, 3.7vw, 3rem);
      font-weight: 650;
      letter-spacing: .27em;
      line-height: 1;
      text-indent: .27em;
      text-shadow: 0 2px 0 #98505c;
    }

    .theme-tease {
      margin: clamp(1rem, 2.6vh, 1.45rem) 0 0;
      color: rgba(255, 248, 223, .94);
      font-size: clamp(.61rem, .96vw, .75rem);
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .theme-tease span { color: #ffcc73; }

    .theme-note {
      max-width: 20rem;
      margin: .65rem 0 0;
      color: rgba(255, 248, 223, .7);
      font-size: clamp(.58rem, .85vw, .7rem);
      font-weight: 500;
      letter-spacing: .06em;
      line-height: 1.5;
    }

    .rule {
      width: clamp(8rem, 18vw, 13rem);
      height: 3px;
      margin: clamp(1.6rem, 4vh, 2.7rem) 0 clamp(.9rem, 1.7vh, 1.2rem);
      border-radius: 99px;
      background: repeating-linear-gradient(90deg, #f7bd66 0 12px, #d97177 12px 24px, #fff2c3 24px 36px);
      box-shadow: 0 3px 0 rgba(78, 43, 50, .2);
    }

    .footnote {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      width: 100%;
      align-self: end;
    }

    .archive-link, .social-links a {
      color: #fff1b9;
      text-decoration: none;
      transition: color .2s ease, opacity .2s ease;
    }

    .archive-link {
      justify-self: center;
      padding: .35rem .55rem;
      border-bottom: 1px solid rgba(255, 241, 185, .5);
    }

    .copyright { white-space: nowrap; }

    .archive-link:hover, .social-links a:hover { color: #fff; }
    .archive-link:focus-visible, .social-links a:focus-visible { outline: 2px solid #fff1b9; outline-offset: 3px; }

    .social-links {
      display: flex;
      justify-self: end;
      gap: 1.5rem;
    }

    .social-links a {
      display: grid;
      place-items: center;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
    }

    .social-links svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .forest, .fireflies {
      position: absolute;
      pointer-events: none;
    }

    .forest { z-index: 1; inset: auto 0 0; height: 44%; }

    .forest::before, .forest::after {
      position: absolute;
      bottom: -3.2rem;
      width: 58%;
      height: 110%;
      border-radius: 48% 52% 0 0;
      background: repeating-linear-gradient(74deg, transparent 0 4.3rem, rgba(21, 71, 53, .78) 4.4rem 5.6rem), #155442;
      box-shadow: inset 0 2rem 3rem rgba(123, 209, 135, .1);
      content: "";
    }

    .forest::before { left: -17%; transform: skewX(-4deg); }
    .forest::after { right: -17%; transform: skewX(4deg); }

    .fireflies {
      z-index: 2;
      inset: 0;
      transform: translate(var(--shift-x-small), var(--shift-y-small));
      transition: transform .25s ease-out;
      will-change: transform;
    }

    .firefly {
      position: absolute;
      width: .38rem;
      height: .38rem;
      border-radius: 50%;
      background: #fff4a8;
      box-shadow: 0 0 .35rem .1rem #ffe97a, 0 0 1.2rem .25rem rgba(255, 224, 95, .55);
      animation: drift var(--duration) ease-in-out var(--delay) infinite alternate, blink 2.4s ease-in-out var(--delay) infinite;
    }

    .firefly:nth-child(1) { top: 23%; left: 12%; --duration: 6s; --delay: -2s; }
    .firefly:nth-child(2) { top: 36%; left: 24%; --duration: 8s; --delay: -5s; }
    .firefly:nth-child(3) { top: 19%; left: 72%; --duration: 7s; --delay: -1s; }
    .firefly:nth-child(4) { top: 43%; left: 85%; --duration: 9s; --delay: -6s; }
    .firefly:nth-child(5) { top: 64%; left: 16%; --duration: 7.5s; --delay: -4s; }
    .firefly:nth-child(6) { top: 72%; left: 38%; --duration: 8.5s; --delay: -7s; }
    .firefly:nth-child(7) { top: 61%; left: 66%; --duration: 6.5s; --delay: -3s; }
    .firefly:nth-child(8) { top: 77%; left: 83%; --duration: 9.5s; --delay: -1.5s; }
    .firefly:nth-child(9) { top: 31%; left: 49%; --duration: 7.3s; --delay: -5.5s; }
    .firefly:nth-child(10) { top: 51%; left: 54%; --duration: 8.7s; --delay: -2.5s; }
    .firefly:nth-child(11) { top: 16%; left: 38%; --duration: 6.8s; --delay: -6.2s; }
    .firefly:nth-child(12) { top: 54%; left: 93%; --duration: 7.8s; --delay: -3.4s; }

    @keyframes drift {
      from { transform: translate3d(-1.2rem, .8rem, 0); }
      to { transform: translate3d(1.8rem, -1.4rem, 0); }
    }

    @keyframes blink {
      0%, 100% { opacity: .24; }
      46% { opacity: 1; }
      62% { opacity: .38; }
    }

    .motion-button {
      display: none;
      position: absolute;
      right: clamp(1.25rem, 3.5vw, 3.5rem);
      bottom: clamp(3.6rem, 7vw, 5.5rem);
      z-index: 5;
      padding: .65rem .85rem;
      border: 1px solid rgba(255, 247, 201, .75);
      border-radius: 999px;
      background: rgba(38, 89, 72, .72);
      color: #fff7c9;
      font: 650 .62rem/1 "General Sans", sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .motion-button.is-visible { display: block; }
    .motion-button[hidden] { display: none; }
    .motion-button:focus-visible { outline: 2px solid #fff7c9; outline-offset: 3px; }

    @media (max-width: 560px) {
      .page { padding: 1.3rem 1.2rem 1.5rem; }
      .masthead { align-items: flex-start; }
      .edition { max-width: 8rem; text-align: right; }
      .hero { padding-bottom: 5.5rem; }
      h1 { font-size: clamp(4.7rem, 25vw, 7rem); }
      .theme-tease { letter-spacing: .1em; }
      .forest { height: 35%; }
      .footnote { font-size: .52rem; letter-spacing: .1em; gap: .45rem; }
      .social-links { gap: .45rem; }
    }

    @media (max-width: 350px) {
      .footnote { font-size: .47rem; letter-spacing: .03em; }
      .archive-link { padding-inline: .3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero, .fireflies { transition: none; }
      .page::after { display: none; }
      .firefly { animation: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const page = document.querySelector('.page');
      const motionButton = document.querySelector('.motion-button');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      if (reducedMotion) return;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      let frameId = 0;
      let queuedX = 0;
      let queuedY = 0;

      function moveScene(x, y) {
        const horizontal = clamp(x, -1, 1);
        const vertical = clamp(y, -1, 1);
        page.style.setProperty('--cursor-x', `${50 + horizontal * 20}%`);
        page.style.setProperty('--cursor-y', `${45 + vertical * 18}%`);
        page.style.setProperty('--glow-x', `${window.innerWidth * (.5 + horizontal * .2)}px`);
        page.style.setProperty('--glow-y', `${window.innerHeight * (.45 + vertical * .18)}px`);
        page.style.setProperty('--shift-x', `${horizontal * 10}px`);
        page.style.setProperty('--shift-y', `${vertical * 8}px`);
        page.style.setProperty('--shift-x-small', `${horizontal * 3}px`);
        page.style.setProperty('--shift-y-small', `${vertical * 2}px`);
        page.style.setProperty('--shift-x-inverse', `${horizontal * -10}px`);
        page.style.setProperty('--shift-y-inverse', `${vertical * -8}px`);
      }

      function queueScene(x, y) {
        queuedX = x;
        queuedY = y;
        if (frameId) return;
        frameId = requestAnimationFrame(() => {
          moveScene(queuedX, queuedY);
          frameId = 0;
        });
      }

      if (finePointer) {
        window.addEventListener('pointermove', (event) => {
          queueScene(event.clientX / window.innerWidth * 2 - 1, event.clientY / window.innerHeight * 2 - 1);
        }, { passive: true });
        return;
      }

      if (!('DeviceOrientationEvent' in window)) return;

      const handleOrientation = (event) => {
        if (event.gamma === null || event.beta === null) return;
        queueScene(event.gamma / 32, (event.beta - 28) / 46);
      };

      const startOrientation = () => {
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        motionButton.hidden = true;
      };

      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        motionButton.hidden = false;
        motionButton.classList.add('is-visible');
        motionButton.addEventListener('click', async () => {
          try {
            if (await DeviceOrientationEvent.requestPermission() === 'granted') startOrientation();
          } catch (_) {
            // The page remains fully usable if access is declined.
          }
        });
      } else {
        startOrientation();
      }
    })();
  </script>
</body>

</html>
