server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export: routes are emitted as both "/about.html" and
    # "/about/index.html" — try the extensionless path, then each variant.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}