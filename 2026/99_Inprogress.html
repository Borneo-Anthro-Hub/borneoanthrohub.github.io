<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borneo Anthro Hub</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
     <link href="./css/output.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    html,
    body {
      overflow-x: hidden;
      background-color: #175b68;
    }
  </style>

</head>


<body class="min-h-screen flex flex-col">

  <div>
    <div id="navbar"></div>
    <div class="navbar-gradient"></div>

    <script src="navbar.js"></script>
    <!-- 1st -->
    <!-- Responsive Image Box -->
    <main class="p-0 m-0 flex-grow">
      <div class="relative overflow-hidden flex items-start justify-center px-6 py-4">

        <a class="absolute mxl:text-6xl md:text-4xl font-bold text-[#FFFBE8] mt-[20vh] -ml-[20vw]">Page Currently still
          in Progress<br>
          <span class="absolute text-xs font-bold text-[#FFFBE8] mt-2">Our woffy duo is out of time and out
            of coffee. Updates will resume once they stop speed-coding in panic mode</span>
        </a>

        <div class="relative shrink-0">
          <div class="fixed top-[35%] left-[40%] flex flex-col space-y-2 z-20">
            <!-- button -->
            <a href="" onclick="history.back()"
              class="z-10 group relative inline-flex items-center justify-center font-[1000] gap-[1vw] px-[2vw] py-[0.6vw] text-[1.2vw] bg-[#e8804d] rounded-full hover:bg-[#ffcb65] transition-color duration-1000 overflow-hidden">
              <!-- Blue  -->
              <svg class="absolute inset-0 max-w-[120%] h-full z-0 transform group-hover:visible  group-hover:translate-x-[6em] transition-transform duration-500 
                            ease-[cubic-bezier(0.34,1.3,0.7,1)] ml-[-2rem] delay-0 group-hover:delay-100"
                viewBox="0 0 700 113" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path
                  d="M11.3408 0H680.376C685.621 0 692 3.48753 692 7.77223L691.433 31.6868V59.2882V80.2135V104.128C692 108.413 685.479 111.9 680.943 111.9L7.37144 112C5.24504 109.509 0 103.53 0 93.3665C0 66.4626 25.8002 56.7971 25.8002 32.8826C25.8002 20.1281 16.4441 3.58719 11.3408 0Z"
                  fill="#54CCC9" />
              </svg>
              <!-- Orange -->
              <svg class="absolute inset-0 max-w-[120%] h-full z-10 transform group-hover:visible group-hover:translate-x-[6em] transition-transform duration-500 
                              ease-in-out ml-[-2rem] delay-0 " viewBox="0 0 700 113" fill="none"
                xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path
                  d="M0 0H684.425C691.453 0 700 3.5218 700 7.84861L699.24 31.9982V59.8709V81.0018V105.151C700 109.478 691.263 113 685.185 113L49.3827 112.094C41.0256 107.566 30.5793 97.0009 30.5793 84.9261C30.5793 62.3865 43.6847 60.9777 43.6847 39.7462C44.0646 16.301 10.4463 3.82369 0 0Z"
                  fill="#E8804D" />
              </svg>
              <span
                class="relative z-20 transition-all text-[1.2vw] text-[#fffbe8] group-hover:text-[#1f3359] group-hover:translate-x-[-0.5rem] duration-1000">
                BACK
              </span>
              <svg class="z-10 h-8 w-auto group-hover:translate-x-[0.5vw] duration-1000" width="42" height="41"
                viewBox="0 0 42 41" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 20.5L38 20.5" stroke="#FFFBE8" stroke-width="6" stroke-miterlimit="10"
                  stroke-linecap="round" stroke-linejoin="round" />
                <path d="M20.8501 3L38.25 20.3L20.8501 37.7" stroke="#FFFBE8" stroke-width="6" stroke-miterlimit="10"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
          </div>
          <img src="images/A.png" alt="Section Background"
            class="ml-[40vw] mt-[5vw] w-[20vw] md:mt-[15vh] h-auto object-contain" />
        </div>
    </main>

  </div>

  <div id="footer"></div>
  <script src="footer.js"></script>

      /* Fullscreen overlay */
      #noscript-warning {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.85);
        /* transparent black  */
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1.5rem;

        z-index: 9999;
      }

    </div>
