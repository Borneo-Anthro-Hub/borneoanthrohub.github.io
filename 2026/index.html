  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <!-- pictogrammers Material Design Icons 
   https://pictogrammers.com/library/mdi/
  -->
  <link rel="stylesheet" href="style.css">
  <style>
    html,
    body {
      overflow-x: hidden;
      background-color: #175b68;
    }

    .horizontal-panels {
      display: flex;
      width: 300vw;
      height: 100vh;
    }

    .horizontal-panel {
      min-width: 100vw;
      height: 100vh;
      flex-shrink: 0;
    }

    /* custom orange */
    .bg-custom-orange {
      background-color: #ff7a00 !important;
    }

    /* optional semi-transparent version */
    .bg-custom-orange-90 {
      background-color: rgba(255, 122, 0, 0.90) !important;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      gsap.registerPlugin(ScrollTrigger);

      gsap.fromTo(".scroll-fade-in", {
        opacity: 0,
        y: 50
      }, {
        opacity: 1,
        y: 0,
        ease: "power2.out",
        scrollTrigger: {
          trigger: ".scroll-fade-in",
          start: "top 80%",
          end: "bottom 20%",
          scrub: false,
          toggleActions: "play reverse play reverse"
        }
      });

      gsap.to(".horizontal-panels", {
        xPercent: -200,
        ease: "none",
        scrollTrigger: {
          trigger: ".Events",
          pin: true,
          scrub: 1,
          anticipatePin: 1,
          end: () => "+=" + (document.querySelector(".horizontal-panels").offsetWidth - window.innerWidth),
        },
      });
    });
  </script>
</head>
