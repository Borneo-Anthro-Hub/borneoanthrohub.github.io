  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borneo Anthro Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    html, body {
      overflow-x: hidden;
      background-color: #ffffff;
      /* background-color: #175b68; */
    }
    .horizontal-panels {
      display: flex;
      width: 300vw;
      height: 100vh;
    }
    .horizontal-panel {
      min-width: 100vw;
      height: 100vh;
      flex-shrink: 0;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;  /* horizontal center */
      align-items: center;      /* vertical center */
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    .inprogress {
      max-width: 800px;
    }
    .message {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 30px;
      color: #333;
    }
    .image-placeholder {
      width: 100%;
      max-width: 500px;
      height: 300px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #666;
      font-size: 1.2rem;
      margin: 0 auto;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      gsap.registerPlugin(ScrollTrigger);

      gsap.fromTo(".scroll-fade-in",
        { opacity: 0, y: 50 },
        {
          opacity: 1,
          y: 0,
          ease: "power2.out",
          scrollTrigger: {
            trigger: ".scroll-fade-in",
            start: "top 80%",
            end: "bottom 20%",
            scrub: false,
            toggleActions: "play reverse play reverse"
          }
        }
      );

      gsap.to(".horizontal-panels", {
        xPercent: -200,
        ease: "none",
        scrollTrigger: {
            trigger: ".Events",
            pin: true,
            scrub: 1,
            anticipatePin: 1,
            end: () => "+=" + (document.querySelector(".horizontal-panels").offsetWidth - window.innerWidth),
        },
        });
    });
  </script>
</head>


<body>


  <div class="inprogress">
    <div class="message">Website Currently in Progress</div>
    <div class="image-placeholder">
      <img src="images/A.png" alt="Coming Soon" style="max-width:100%; border-radius:12px;">
    </div>
  </div>


</body> 



</html>
