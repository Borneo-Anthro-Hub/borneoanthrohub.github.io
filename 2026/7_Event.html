<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | Borneo Anthro Hub</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link href="./css/output.css" rel="stylesheet" />
    <!-- <link href="./fonts/Fonts/WEB/css/general-sans.css" rel="fonts"> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script> -->
    <link href="https://fonts.cdnfonts.com/css/general-sans" rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap');

        /* ===== SECTION 1: HERO ===== */
        .hero {
            position: relative;
            background-image: url("images/Page Banner-100 1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 200px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .hero h1 {
            font-family: "General Sans", sans-serif;
            font-weight: 600;
            position: relative;
            z-index: 1;
            font-size: 3rem;
            color: #fffbe8;
            text-shadow: 3px 5px 5px rgba(0, 0, 0, 0.3);
        }

        /* ===== SECTION 2: INFO ===== */
        .info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 0;
            padding-top: 40px;
        }

        .banner-img {
            width: 80%;
            /* scale to 80% of the page */
            max-width: 1000px;
            /* prevent it from getting too big */
            height: auto;
            /* keep original image ratio automatically */
            border-radius: 10px;
            /* optional */
            display: block;
        }

        /* ===== SECTION 3: BOXES ===== */
        #section3 {
            padding: 40px 20px;
        }

        .fix-br {
            display: none;
        }
    </style>
</head>

<body>
    <div>
        <div id="navbar"></div>
        <div class="navbar-gradient"></div>

        <script src="./navbar.js"></script>
        <!-- SECTION 1: HERO -->
        <div class="hero">
            <section>
                <h1 style="font-size: 72px">Events</h1>
            </section>
        </div>
        <main class="info mt-12">
            <div class="flex flex-col items-center justify-center-safe">
                <div class="flex justify-center-safe items-center-safe w-full">
                    <div class="w-90 text-3xl text-center text-white my-5">
                        <p>Event Time Schedule</p>
                    </div>

                </div>
                <div class="flex justify-center-safe w-full">
                    <iframe src="./timelineSchedule.html" title="Schedule" class="w-90 h-267.5 md:w-364 md:h-267.5"></iframe>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
